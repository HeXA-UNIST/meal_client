name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository (${{ github.ref_name }} branch)
        uses: actions/checkout@v7

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          
      - run: flutter --version
        shell: bash

      - name: Decode keystore and create jks and properties file for signing the app
        shell: bash
        run: |
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks
          echo "storeFile=keystore.jks" >> key.properties
          echo "keyAlias=key" >> key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> key.properties
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: ./android
        
      - name: Inject Signing Config into build.gradle.kts
        shell: python
        run: |
          import os
          
          file_path = "android/app/build.gradle.kts"
          with open(file_path, "r") as f:
              content = f.read()
          
          # 1. 상단 Import 추가
          imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
          if "import java.util.Properties" not in content:
              content = imports + content
          
          # 2. Keystore 로드 로직 (plugins 블록 바로 뒤에 삽입)
          keystore_logic = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
          if "val keystoreProperties" not in content:
              # android { 를 찾아 그 앞에 로직을 추가
              content = content.replace("android {", f"\n{keystore_logic}\nandroid {{", 1)
          
          # 3. signingConfigs 및 buildTypes 수정
          # 'android {' 블록 시작 지점에 signingConfigs 삽입
          signing_config = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
          if "signingConfigs {" not in content:
              content = content.replace("android {", f"android {{\n{signing_config}", 1)
          
          # 4. release 빌드 타입 수정
          content = content.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          
          with open(file_path, "w") as f:
              f.write(content)

      - name: Build
        run: flutter build apk --release
        shell: bash
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
