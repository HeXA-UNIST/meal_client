name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clone repository (${{ github.ref_name }} branch)
        uses: actions/checkout@v6

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9

      - run: flutter --version
        shell: bash

      - name: Install certificate and provisioning profiles
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_GITHUB_KEYCHAIN_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/widget.mobileprovision"
          PROFILES_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH"
          printf '%s' "$EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$BUILD_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILES_DIRECTORY"
          for PROFILE_PATH in "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH"; do
            PROFILE_PLIST="$RUNNER_TEMP/$(basename "$PROFILE_PATH").plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
            cp "$PROFILE_PATH" "$PROFILES_DIRECTORY/$PROFILE_UUID.mobileprovision"
          done

      - name: Build
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
        shell: bash
        working-directory: .

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./build/ios/ipa/*.ipa
          if-no-files-found: error
