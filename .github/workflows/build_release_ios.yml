name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Clone repository (${{ github.ref_name }} branch)
        uses: actions/checkout@v7

      - name: Resolve Flutter version
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail

          constraint=$(yq -r '.environment.flutter' pubspec.yaml)

          version=$(python3 .github/scripts/resolve_flutter_version.py \
            "$constraint" "$RUNNER_OS")

          echo "Flutter constraint: $constraint; selected: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve Flutter version
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail

          constraint=$(yq -r '.environment.flutter' pubspec.yaml)

          version=$(python3 .github/scripts/resolve_flutter_version.py \
            "$constraint" "$RUNNER_OS")

          echo "Flutter constraint: $constraint; selected: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - run: flutter --version
        shell: bash

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(yq -r '.version' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install certificate and provisioning profiles
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_OPTIONS_PLIST: ${{ vars.IOS_EXPORT_OPTIONS_PLIST }}
        run: |
          set +x
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/widget.mobileprovision"
          PROFILES_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH"
          printf '%s' "$EXPORT_OPTIONS_PLIST" > "$RUNNER_TEMP/ExportOptions.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$BUILD_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILES_DIRECTORY"
          for PROFILE_PATH in "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH"; do
            PROFILE_PLIST="$RUNNER_TEMP/$(basename "$PROFILE_PATH").plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
            cp "$PROFILE_PATH" "$PROFILES_DIRECTORY/$PROFILE_UUID.mobileprovision"
          done

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app.mobileprovision.plist")
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget.mobileprovision.plist")
          export APP_PROFILE_UUID WIDGET_PROFILE_UUID

          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            {"Runner" => ENV.fetch("APP_PROFILE_UUID"), "BapUWidget" => ENV.fetch("WIDGET_PROFILE_UUID")}.each do |name, uuid|
              target = project.targets.find { |item| item.name == name } or abort "Target not found: #{name}"
              config = target.build_configurations.find { |item| item.name == "Release" } or abort "Release configuration not found: #{name}"
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
              config.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = uuid
            end
            project.save
          '

          # IPA 내보내기도 수동 서명을 사용하고, 앱·위젯에 설치한 프로파일의 UUID를 지정한다.
          # 프로파일 갱신으로 UUID가 바뀌어도 IOS_EXPORT_OPTIONS_PLIST를 따로 수정하지 않도록
          # 변수에서 읽은 plist의 서명 방식과 프로파일 매핑만 교체하고 나머지 설정은 유지한다.
          /usr/libexec/PlistBuddy -c 'Delete :signingStyle' "$RUNNER_TEMP/ExportOptions.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Delete :provisioningProfiles' "$RUNNER_TEMP/ExportOptions.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.wjddnwls7879.unistbab string $APP_PROFILE_UUID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.wjddnwls7879.unistbab.widget string $WIDGET_PROFILE_UUID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          mv build/ios/ipa/meal_client.ipa "build/ios/ipa/meal_client-$APP_VERSION.ipa"
        shell: bash
        working-directory: .

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./build/ios/ipa/meal_client-${{ steps.version.outputs.value }}.ipa
          if-no-files-found: error
