name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    uses: ./.github/workflows/build_android.yml
    with:
      ci: true

  ios:
    uses: ./.github/workflows/build_release_ios.yml
    with:
      ci: true

  web:
    uses: ./.github/workflows/build_web.yml
    with:
      ci: true

  validate:
    name: PR validation
    runs-on: ubuntu-latest
    needs: [android, ios, web]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require all platforms to pass
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$ANDROID_RESULT" = success
          test "$IOS_RESULT" = success
          test "$WEB_RESULT" = success
